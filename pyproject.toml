[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-motion"
version = "0.1.0"
description = "Reconstrucao de contornos com epiciclos de Fourier para Reels"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fourier-motion = "fourier_motion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
